[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragcheck-ci"
version = "0.1.0"
description = "Regression tests for RAG pipelines: catch quality drops in CI before your users do."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "M S Gulshan", email = "gulshanms2003@gmail.com" }]
keywords = ["rag", "llm", "evaluation", "testing", "ci", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "anthropic>=1"]

[project.scripts]
ragcheck = "ragcheck.cli:app"

[project.urls]
Homepage = "https://github.com/gulshanmsgit/ragcheck"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcheck"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Report text uses real typographic dashes and minus signs on purpose
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length is left to ruff format

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ragcheck"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
