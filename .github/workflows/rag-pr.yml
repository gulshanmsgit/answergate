# Runs AnswerGate on every pull request that touches the FastAPI-docs RAG, comments the result on the
# PR and fails the check on a regression. It compares against the committed baseline
# (examples/fastapi_qdrant/.answergate/baseline.json), so only the PR's version is run.
#
# Runs on a self-hosted runner with Ollama (granite4.1:8b), so documents and answers stay on that machine.
# A self-hosted runner executes the PR's code: this job only runs for branches of this repository, never forks.
name: RAG regression check

on:
  pull_request:
    paths: ["examples/fastapi_qdrant/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: answergate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  answergate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: examples/fastapi_qdrant
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python -m venv .venv
          BIN=$([ -d .venv/Scripts ] && echo .venv/Scripts || echo .venv/bin)
          echo "BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install -q -r requirements.txt

      - name: Fetch the documents
        run: $BIN/python fetch_docs.py

      - name: Start the RAG app
        run: |
          $BIN/python -m uvicorn app:app --port 8000 > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 300); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          cat app.log; exit 1

      # This repository's own action, at the PR's version: runs the suite, uploads the report,
      # comments on the PR and fails the check on a regression
      - uses: ./
        with:
          working-directory: examples/fastapi_qdrant

      - name: Stop the RAG app
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true
