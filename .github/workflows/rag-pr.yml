# Runs RAGCheck on every pull request that touches the FastAPI-docs RAG, comments the result on the
# PR and fails the check on a regression. It compares against the committed baseline
# (examples/fastapi_qdrant/.ragcheck/baseline.json), so only the PR's version is run.
#
# Runs on a self-hosted runner with Ollama (granite4.1:8b), so documents and answers stay on that machine.
# A self-hosted runner executes the PR's code: this job only runs for branches of this repository, never forks.
name: RAG regression check

on:
  pull_request:
    paths: ["examples/fastapi_qdrant/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ragcheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ragcheck:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: examples/fastapi_qdrant
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python -m venv .venv
          BIN=$([ -d .venv/Scripts ] && echo .venv/Scripts || echo .venv/bin)
          echo "BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install -q -e ../.. -r requirements.txt

      - name: Fetch the documents
        run: $BIN/python fetch_docs.py

      - name: Start the RAG app
        run: |
          $BIN/python -m uvicorn app:app --port 8000 > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 300); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          cat app.log; exit 1

      - name: Run RAGCheck
        id: rc
        continue-on-error: true
        run: $BIN/ragcheck run -c ragcheck.yaml -l "pr-${{ github.event.pull_request.number }}" --md summary.md --html report.html

      - name: Stop the RAG app
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragcheck-report
          path: examples/fastapi_qdrant/report.html

      - name: Comment on the PR
        if: always() && hashFiles('examples/fastapi_qdrant/summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('examples/fastapi_qdrant/summary.md', 'utf8');
            const marker = '<!-- ragcheck-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail on regression
        if: steps.rc.outcome == 'failure'
        run: exit 1
