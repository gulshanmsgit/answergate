# ShopKart (fictional): online store customer support
target:
  type: python
  callable: demo_rag:ecommerce
golden_set: ecommerce/golden.jsonl
workdir: .answergate/ecommerce
judge:
  provider: none        # run_demo.py --judge ollama|anthropic|openai switches a judge on
k: 3
thresholds:
  min: { hit_rate: 0.8 }
  default_max_drop: 0.05
  guardrails_must_pass: true
  guardrail_gate: new   # known failures in the accepted baseline warn; any new failure fails
